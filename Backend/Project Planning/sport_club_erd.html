
<style>
#erd-container { padding: 1rem 0; }
#erd svg { width: 100%; }
.erd-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 12px; }
.erd-legend { display: flex; gap: 20px; margin-top: 14px; flex-wrap: wrap; }
.erd-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); }
.erd-legend-dot { width: 12px; height: 12px; border-radius: 3px; }
</style>

<div id="erd-container">
  <div id="erd"></div>
  <div class="erd-legend">
    <div class="erd-legend-item"><div class="erd-legend-dot" style="background:#534AB7"></div> Auth / Identity</div>
    <div class="erd-legend-item"><div class="erd-legend-dot" style="background:#0F6E56"></div> Club Structure</div>
    <div class="erd-legend-item"><div class="erd-legend-dot" style="background:#993C1D"></div> Billing</div>
    <div class="erd-legend-item"><div class="erd-legend-dot" style="background:#185FA5"></div> Facilities</div>
    <div class="erd-legend-item">
      <svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#639922" stroke-width="1.5" marker-end="url(#arr-legend)"/><defs><marker id="arr-legend" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#639922" stroke-width="1.5"/></marker></defs></svg>
      FK / Navigation
    </div>
  </div>
</div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryBorderColor: dark ? '#AFA9EC' : '#534AB7',
    primaryTextColor: dark ? '#CECBF6' : '#26215C',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    secondaryBorderColor: dark ? '#5DCAA5' : '#0F6E56',
    tertiaryColor: dark ? '#712B13' : '#FAECE7',
    tertiaryBorderColor: dark ? '#F0997B' : '#993C1D',
  },
  er: { diagramPadding: 20, layoutDirection: 'TB', minEntityWidth: 100, minEntityHeight: 75, entityPadding: 15, useMaxWidth: true }
});

const diagram = `erDiagram
  User {
    int Id PK
    string FullName
    string Email
    string PasswordHash
    string Phone
    string Role
    datetime CreatedAt
  }

  Coach {
    int Id PK
    int UserId FK
    string Specialization
    string Bio
    datetime HireDate
  }

  Team {
    int Id PK
    string Name
    string Type
    int CoachId FK
    datetime CreatedAt
  }

  Member {
    int Id PK
    int UserId FK
    int TeamId FK
    datetime JoinedAt
  }

  Plan {
    int Id PK
    string Name
    string Type
    decimal Price
    int DurationMonths
  }

  Subscription {
    int Id PK
    int MemberId FK
    int PlanId FK
    datetime StartDate
    datetime EndDate
    string Status
    string PaymentStatus
  }

  Activity {
    int Id PK
    string Name
    string Description
    int CoachId FK
    int TeamId FK
    string Schedule
    int MaxCapacity
  }

  Pitch {
    int Id PK
    int Number
    string Type
    decimal PricePerHour
  }

  Booking {
    int Id PK
    int MemberId FK
    int PitchId FK
    int CoachId FK
    datetime Date
    time StartTime
    time EndTime
    string Status
  }

  User ||--o| Coach : "has profile"
  User ||--o| Member : "has profile"
  Coach ||--o{ Team : "trains"
  Team ||--o{ Member : "contains"
  Member ||--o{ Subscription : "has"
  Plan ||--o{ Subscription : "used in"
  Coach ||--o{ Activity : "leads"
  Team ||--o{ Activity : "hosts"
  Member ||--o{ Booking : "makes"
  Pitch ||--o{ Booking : "reserved in"
  Coach ||--o{ Booking : "involved in"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
